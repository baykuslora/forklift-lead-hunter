name: Weekly Forklift Leads Pipeline

on:
  schedule:
    - cron: '30 5 * * 1'
  workflow_dispatch:

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Repoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Bağımlılıkları Yükle
      run: |
        pip install -r requirements.txt
        playwright install chromium --with-deps

    - name: Pipeline'ı Çalıştır
      env:
        SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        SMTP_SERVER: "smtp.gmail.com"
        SMTP_PORT: "587"
        SMTP_USER: ${{ secrets.SMTP_USER }}
        SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        RECIPIENTS: ${{ secrets.RECIPIENTS }}
      run: |
        python main.py

    - name: Veritabanı Değişikliklerini Kaydet
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/leads_history.db || true
        git commit -m "chore: haftalık lead geçmişi güncellendi [skip ci]" || echo "Değişiklik yok"
        git push || true